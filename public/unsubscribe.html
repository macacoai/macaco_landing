<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Macaco - Cancelar suscripcion</title>
    <meta name="robots" content="noindex, nofollow">
    <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.20.15/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="static/logo.png">
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#e6a817',
                        'primary-light': '#f2c55c',
                        'primary-dark': '#b8860b',
                    },
                },
            },
        };

        const API_BASE_URL = 'https://api.macaco.ai';

        const App = () => {
            const [status, setStatus] = useState('loading');
            const [message, setMessage] = useState('');
            const [isDarkMode, setIsDarkMode] = useState(false);

            useEffect(() => {
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                setIsDarkMode(prefersDark);
                if (prefersDark) {
                    document.documentElement.classList.add('dark');
                }
            }, []);

            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                const token = params.get('token');

                if (!token) {
                    setStatus('no_token');
                    setMessage('Link invalido. No se encontro el token de cancelacion.');
                    return;
                }

                fetch(`${API_BASE_URL}/api/v1/marketing/unsubscribe/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token }),
                })
                .then(async (response) => {
                    const data = await response.json();
                    if (response.ok) {
                        setStatus('success');
                        setMessage(data.detail);
                    } else {
                        setStatus('error');
                        setMessage(data.detail || 'Ocurrio un error al procesar tu solicitud.');
                    }
                })
                .catch(() => {
                    setStatus('error');
                    setMessage('No se pudo conectar con el servidor. Intenta de nuevo mas tarde.');
                });
            }, []);

            const icon = {
                loading: null,
                success: (
                    <div className="w-16 h-16 rounded-full bg-green-100 dark:bg-green-900/30 flex items-center justify-center mx-auto mb-6">
                        <svg className="w-8 h-8 text-green-600 dark:text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path>
                        </svg>
                    </div>
                ),
                error: (
                    <div className="w-16 h-16 rounded-full bg-red-100 dark:bg-red-900/30 flex items-center justify-center mx-auto mb-6">
                        <svg className="w-8 h-8 text-red-600 dark:text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </div>
                ),
                no_token: (
                    <div className="w-16 h-16 rounded-full bg-yellow-100 dark:bg-yellow-900/30 flex items-center justify-center mx-auto mb-6">
                        <svg className="w-8 h-8 text-yellow-600 dark:text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z"></path>
                        </svg>
                    </div>
                ),
            };

            const titles = {
                loading: 'Procesando...',
                success: 'Suscripcion cancelada',
                error: 'Hubo un problema',
                no_token: 'Link invalido',
            };

            return (
                <div className="font-inter min-h-screen bg-white dark:bg-black flex flex-col">
                    <header className="py-6 px-4">
                        <div className="max-w-4xl mx-auto flex items-center justify-center gap-3">
                            <img src="static/logo.png" alt="Macaco" className="w-10 h-10 rounded-lg" />
                            <span className="text-2xl font-bold text-black dark:text-white">Macaco</span>
                        </div>
                    </header>

                    <main className="flex-1 flex items-center justify-center px-4 pb-16">
                        <div className="max-w-md w-full text-center">
                            {status === 'loading' ? (
                                <div className="animate-pulse">
                                    <div className="w-16 h-16 rounded-full bg-gray-200 dark:bg-gray-700 mx-auto mb-6"></div>
                                    <div className="h-8 bg-gray-200 dark:bg-gray-700 rounded w-3/4 mx-auto mb-4"></div>
                                    <div className="h-4 bg-gray-200 dark:bg-gray-700 rounded w-1/2 mx-auto"></div>
                                </div>
                            ) : (
                                <div>
                                    {icon[status]}
                                    <h1 className="text-3xl font-bold text-black dark:text-white mb-4">
                                        {titles[status]}
                                    </h1>
                                    <p className="text-lg text-black/60 dark:text-white/60 mb-8">
                                        {message}
                                    </p>
                                    {status === 'success' && (
                                        <p className="text-sm text-black/40 dark:text-white/40">
                                            Si cambias de opinion, podes volver a registrarte en{' '}
                                            <a href="https://macaco.ai" className="text-primary hover:underline">macaco.ai</a>
                                        </p>
                                    )}
                                </div>
                            )}
                        </div>
                    </main>

                    <footer className="py-6 px-4 border-t border-gray-200 dark:border-gray-800">
                        <div className="max-w-4xl mx-auto text-center text-sm text-black/40 dark:text-white/40">
                            &copy; 2025 Macaco. All rights reserved.
                        </div>
                    </footer>
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        html { scroll-behavior: smooth; }
    </style>
</body>
</html>
