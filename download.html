    <script type="text/babel">
        const { useState, useEffect } = React;

        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#e6a817',
                        'primary-light': '#f2c55c',
                        'primary-dark': '#b8860b',

                    animation: {
                        'fade-in-up': 'fadeInUp 0.8s ease-out',
                        'fade-in': 'fadeIn 0.6s ease-out',
                    },
                },
            },
        };

        const DownloadCard = ({ icon, platform, description, downloadUrl, loading }) => (
            <a
                href={downloadUrl || '#'}
                onClick={(e) => {
                    if (!downloadUrl) e.preventDefault();
                    posthog.capture('download_clicked', { platform });
                }}
                className={`group flex flex-col items-center p-8 rounded-2xl border-2 transition-all duration-300 ${
                    downloadUrl
                        ? 'border-primary/30 hover:border-primary hover:shadow-2xl hover:shadow-primary/10 hover:-translate-y-2 cursor-pointer bg-white dark:bg-gray-900'
                        : 'border-gray-200 dark:border-gray-700 opacity-50 cursor-not-allowed bg-gray-50 dark:bg-gray-800'
                }`}
            >
                <div className="text-5xl mb-4">{icon}</div>
                <h3 className="text-xl font-bold text-black dark:text-white mb-2">{platform}</h3>
                <p className="text-sm text-black/60 dark:text-white/60 mb-6 text-center">{description}</p>
                {loading ? (
                    <div className="px-6 py-3 rounded-full bg-gray-200 dark:bg-gray-700 text-black/40 dark:text-white/40 text-sm font-medium">
                        Loading...
                    </div>
                ) : downloadUrl ? (
                    <div className="px-6 py-3 rounded-full bg-gradient-to-r from-primary to-primary-dark text-black font-semibold text-sm group-hover:shadow-lg group-hover:shadow-primary/30 transition-all duration-300">
                        Download
                    </div>
                ) : (
                    <div className="px-6 py-3 rounded-full bg-gray-200 dark:bg-gray-700 text-black/40 dark:text-white/40 text-sm font-medium">
                        Unavailable
                    </div>
                )}
            </a>
        );

        const App = () => {
            const [links, setLinks] = useState(null);
            const [loading, setLoading] = useState(true);
            const [isDarkMode, setIsDarkMode] = useState(false);

            useEffect(() => {
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                setIsDarkMode(prefersDark);
                if (prefersDark) {
                    document.documentElement.classList.add('dark');
                }
            }, []);

            useEffect(() => {
                posthog.capture('download_page_viewed');
                getLatestDownloadLinks().then(result => {
                    setLinks(result);
                    setLoading(false);
                });
            }, []);

            return (

                                Download Macaco

                            <p className="text-lg text-black/60 dark:text-white/60 mb-12 max-w-xl mx-auto">
                                Thanks for joining the beta! Choose your platform to get started.
                            </p>

                            {/* Download Cards */}

                                <DownloadCard
                                    icon={<svg className="w-12 h-12" viewBox="0 0 24 24" fill="currentColor"><path d="M0 3.449L9.75 2.1v9.451H0m10.949-9.602L24 0v11.4H10.949M0 12.6h9.75v9.451L0 20.699M10.949 12.6H24V24l-12.9-1.801"/></svg>}
                                    platform="Windows"
                                    description=".exe installer"

                                    platform="macOS"
                                    description=".dmg installer"
                                    downloadUrl={links?.mac}
                                    loading={loading}
                                />
                                <DownloadCard
                                    icon={<svg className="w-12 h-12" viewBox="0 0 24 24" fill="currentColor"><path d="M12.504 0c-.155 0-.315.008-.48.021-4.226.333-3.105 4.807-3.17 6.298-.076 1.092-.3 1.953-1.05 3.02-.885 1.051-2.127 2.75-2.716 4.521-.278.832-.41 1.684-.287 2.489a.424.424 0 00-.11.135c-.26.268-.45.6-.663.839-.199.199-.485.267-.797.4-.313.136-.658.269-.864.68-.09.189-.136.394-.132.602 0 .199.027.4.055.536.058.399.116.728.04.97-.249.68-.28 1.145-.106 1.484.174.334.535.47.94.601.81.2 1.91.135 2.774.6.926.466 1.866.67 2.616.47.526-.116.97-.464 1.208-.946.587-.003 1.23-.269 2.26-.334.699-.058 1.574.267 2.577.2.025.134.063.198.114.333l.003.003c.391.778 1.113 1.368 1.884 1.43.199.023.395-.049.543-.16.646-.484.943-1.2.83-1.98-.053-.429-.176-.86-.374-1.235a.069.069 0 01-.023-.045c.012-.074.025-.188.018-.267-.086-1.283-.669-2.096-1.365-2.75a.075.075 0 01.013-.045l.003-.003c.396-.72.683-1.475.756-2.24.054-.579-.022-1.162-.269-1.743a.067.067 0 010-.025c.382-.698.543-1.39.506-2.054a3.97 3.97 0 00-.354-1.357.067.067 0 01-.004-.033 7.033 7.033 0 00-.59-1.845 3.17 3.17 0 00-.08-.152 2.65 2.65 0 00-.02-.03c-.017-.02-.056-.042-.076-.049a.37.37 0 00-.148-.02c-1.053-.015-2.04.63-2.76 1.334C13.94 5.21 13.575 6.067 13.575 6.067s-.282.693-.677 1.005c-.309.245-.696.37-1.098.37-.402 0-.789-.125-1.098-.37-.402-.314-.685-1.01-.685-1.01s-.369-.861-1.144-1.81c-.66-.6-1.487-1.05-2.365-1.125 0 0-.464-.02-.808.252a.37.37 0 00-.094.08c-.026.037-.053.074-.074.117a7.033 7.033 0 00-.59 1.845.067.067 0 01-.005.033 3.97 3.97 0 00-.353 1.357c-.037.664.124 1.356.506 2.054a.067.067 0 010 .025c-.247.581-.323 1.164-.27 1.743.074.765.361 1.52.757 2.24l.003.003a.075.075 0 01.013.045c-.696.654-1.279 1.467-1.365 2.75-.007.079.006.193.018.267a.069.069 0 01-.023.045c-.198.375-.32.806-.374 1.235-.113.78.184 1.496.83 1.98.148.11.344.183.544.16.77-.062 1.492-.652 1.883-1.43l.003-.003c.051-.135.089-.199.114-.333 1.003.067 1.878-.258 2.577-.2 1.03.065 1.673.331 2.26.334.238.482.682.83 1.208.946.75.2 1.6                                     platform="Linux"
                                    description=".AppImage"
                                    downloadUrl={links?.linux}
                                    loading={loading}
                                />
                            </div>

                            {/* Help Section */}
                            <div className="p-6 rounded-2xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
                                <h3 className="font-semibold text-black dark:text-white mb-3">Getting Started</h3>
                                <ol className="text-sm text-black/60 dark:text-white/60 text-left space-y-2 max-w-md mx-auto">
                                    <li>1. Download and install Macaco for your platform</li>
                                    <li>2. Sign in with your Google account</li>
                                    <li>3. Create your first project and start chatting with the AI to generate tests</li>
                                </ol>
                                <div className="mt-4 pt-4 border-t border-gray-200 dark:border-gray-800">
                                    <p className="text-sm text-black/50 dark:text-white/50">
                                        Need help? Join our <a href="https://discord.gg/d5DTCwTTtJ" target="_blank" rel="noopener noreferrer" className="text-primary hover:underline font-medium">Discord community</a>
                                    </p>
                                </div>
                            </div>

                            {/* Version info */}
                            {links?.version && (
                                <p className="mt-8 text-xs text-black/30 dark:text-white/30">
                                    Latest version: {links.version}
                                </p>
                            )}
                        </div>
                    </main>

                    {/* Footer */}
                    <footer className="py-6 px-4 border-t border-gray-200 dark:border-gray-800">
                        <div className="max-w-4xl mx-auto text-center text-sm text-black/40 dark:text-white/40">
                            &copy; 2025 Macaco. All rights reserved.
                        </div>
                    </footer>
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));

        async function getLatestDownloadLinks() {
            try {
                const response = await fetch('https://api.github.com/repos/macacoai/macaco-releases/releases/latest');
                const release = await response.json();

                const links = {
                    windows: null,
                    mac: null,
                    linux: null,
                    version: release.tag_name
                };

                release.assets.forEach(asset => {
                    if (asset.name.includes('Windows') && asset.name.endsWith('.exe')) {
                        links.windows = asset.browser_download_url;
                    } else if (asset.name.includes('Mac') && asset.name.endsWith('.dmg')) {
                        links.mac = asset.browser_download_url;
                    } else if (asset.name.includes('Linux') && asset.name.endsWith('.AppImage')) {
                        links.linux = asset.browser_download_url;
                    }
                });

                return links;
            } catch (error) {
                console.error('Error fetching latest release:', error);
                return null;
            }
        }
    </script>
